<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf4ef" />
  <title>Coming soon · mydearbonnie</title>
  <style>
    :root {
      --ink: #2f2a3a;
      --ink-soft: #6f6878;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: 'PingFang HK', 'PingFang TC', 'Noto Sans TC', 'Noto Sans CJK TC',
                   'Microsoft JhengHei', 'Heiti TC', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      /* Soft cream → pink → pale blue (same as scroll-demo) */
      background:
        radial-gradient(60vmax 60vmax at 12% 8%, rgba(255, 214, 196, .55), transparent 60%),
        radial-gradient(55vmax 55vmax at 92% 95%, rgba(206, 220, 250, .6), transparent 60%),
        linear-gradient(160deg, #fdf7f1 0%, #f9eff3 52%, #eff3fb 100%);
      background-attachment: fixed;
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    p {
      margin: 0;
      font-weight: 500;
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      letter-spacing: 0.04em;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <main>
    <p>Coming soon...</p>
  </main>
</body>
</html>
